            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        header {
            background: rgba(10, 20, 40, 0.95);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
            position: relative;
            z-index: 50;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-light);
            opacity: 0.7;
        }

        .header-info {
            text-align: right;
        }

        .header-info p {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        /* Main Container */
        .container {
            display: flex;
            height: calc(100vh - 80px);
            gap: 1rem;
            padding: 1rem;
        }

        /* Map Area */

            flex: 1;
            background: rgba(27, 45, 77, 0.5);
            border: 2px solid var(--accent);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        .map-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: rgba(10, 20, 40, 0.95);
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 1rem;
            pointer-events: none;
            z-index: 1000;
            max-width: 250px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
            display: none;
        }

        .tooltip.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .tooltip-country {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tooltip-info {
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        .tooltip-hint {
            font-size: 0.75rem;
            color: var(--success);
            margin-top: 0.5rem;
            font-style: italic;
        }

            border-radius: 12px;

        }

        .info-panel::-webkit-scrollbar-thumb {

        }

            color: var(--danger);

        }

            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }

            0%, 100% {

            50% {

        .controls {

            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 0.8rem;
            z-index: 40;

            color: var(--accent);

        function resizeCanvas() {
            const rect = document.querySelector('.map-container').getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
        }

        function draw() {
            ctx.fillStyle = '#0a1428';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 + panX, canvas.height / 2 + panY);
            ctx.scale(scale, scale);

            // Draw grid
            drawGrid();

            // Draw countries
            Object.entries(countryRegions).forEach(([country, region]) => {
                drawCountry(country, region);
            });

            ctx.restore();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = -400; i < 400; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, -300);
                ctx.lineTo(i, 300);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-400, i);
                ctx.lineTo(400, i);
                ctx.stroke();
            }
        }

        function drawCountry(name, region) {
            const isSelected = selectedCountry === name;
            
            // Draw country rectangle
            ctx.fillStyle = isSelected ? 'rgba(0, 255, 136, 0.3)' : 'rgba(0, 212, 255, 0.15)';
            ctx.strokeStyle = isSelected ? '#00ff88' : 'rgba(0, 212, 255, 0.5)';
            ctx.lineWidth = isSelected ? 3 : 2;

            ctx.fillRect(
                region.x - region.radius,
                region.y - region.radius,
                region.radius * 2,
                region.radius * 2
            );
            ctx.strokeRect(
                region.x - region.radius,
                region.y - region.radius,
                region.radius * 2,
                region.radius * 2
            );

            // Draw label
            ctx.fillStyle = isSelected ? '#00ff88' : 'rgba(224, 224, 224, 0.8)';
            ctx.font = isSelected ? 'bold 12px Arial' : '11px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name, region.x, region.y);

            // Draw flag
            const flagSize = isSelected ? 14 : 12;
            ctx.font = `${flagSize}px Arial`;
            ctx.fillText(countryData[name].flag, region.x, region.y - 15);
        }

        function getCountryAtMouse(x, y) {
            // Convert mouse position to canvas coordinates
            const rect = canvas.getBoundingClientRect();
            const mouseX = (x - rect.left - canvas.width / 2 - panX) / scale;
            const mouseY = (y - rect.top - canvas.height / 2 - panY) / scale;

            for (const [country, region] of Object.entries(countryRegions)) {
                const distance = Math.sqrt(
                    Math.pow(mouseX - region.x, 2) + Math.pow(mouseY - region.y, 2)
                );
                if (distance < region.radius) {
                    return country;
                }
            }
            return null;
        }

        // ==================== EVENT LISTENERS ====================
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                panX += e.clientX - dragStart.x;
                panY += e.clientY - dragStart.y;
                dragStart = { x: e.clientX, y: e.clientY };
                draw();
            } else {
                const country = getCountryAtMouse(e.clientX, e.clientY);
                if (country) {
                    canvas.style.cursor = 'pointer';
                    showTooltip(e.clientX, e.clientY, country);
                } else {
                    canvas.style.cursor = 'grab';
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const country = getCountryAtMouse(e.clientX, e.clientY);
            if (country && !isDragging) {
                selectCountry(country);
            } else if (!country) {
                isDragging = true;
                dragStart = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            hideTooltip();
            canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            scale = Math.max(0.5, Math.min(scale * zoomFactor, 3));
            draw();
        });

        // Control buttons
        document.getElementById('zoomInBtn').addEventListener('click', () => {
            scale = Math.min(scale * 1.2, 3);
            draw();
        });

        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            scale = Math.max(scale / 1.2, 0.5);
            draw();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            scale = 1;
            panX = 0;
            panY = 0;
            selectedCountry = null;
            draw();
            document.getElementById('infoPanelContent').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🌐</div>
                    <p>Click on a country to view detailed information</p>
                </div>
            `;
        });

        // ==================== TOOLTIP ====================
        function showTooltip(x, y, country) {
            const tooltip = document.getElementById('tooltip');
            const data = countryData[country];
            
            document.getElementById('tooltipCountry').textContent = `${data.flag} ${country}`;
            document.getElementById('tooltipInfo').textContent = data.description;

            tooltip.style.left = (x + 15) + 'px';
            tooltip.style.top = (y - 20) + 'px';
            tooltip.classList.add('active');
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('active');
        }

        // ==================== COUNTRY SELECTION ====================
        function selectCountry(country) {
            selectedCountry = country;
            const data = countryData[country];

            // Update header
            document.getElementById('currentCountry').textContent = `${data.flag} ${country.toUpperCase()}`;

            // Update info panel
            let html = `
                <div class="panel-header">
                    <div class="panel-title">${data.flag} ${country}</div>
                    <div class="panel-subtitle">${data.region}</div>
                </div>

                <div class="info-section">
                    <div class="section-title">📊 Economic Indicators</div>
                    <div class="rank-item">
                        <span class="rank-label">GDP Rank</span>
                        <span class="rank-value">#${data.gdp.rank} ${data.gdp.value}</span>
                    </div>
                    <div class="rank-item">
                        <span class="rank-label">GDP Per Capita</span>
                        <span class="rank-value">#${data.gdpPerCapita.rank}</span>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--text-light); padding: 0.5rem 0.8rem; text-align: center; background: rgba(0, 212, 255, 0.05); border-radius: 4px;">
                        ${data.gdpPerCapita.value}
                    </div>
                </div>

                <div class="info-section">
                    <div class="section-title">😊 Quality of Life</div>
                    <div class="rank-item">
                        <span class="rank-label">Happiness Index</span>
                        <span class="rank-value">#${data.happinessIndex.rank}</span>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--success); padding: 0.5rem 0.8rem; text-align: center; background: rgba(0, 255, 136, 0.1); border-radius: 4px; font-weight: 700;">
                        ${data.happinessIndex.score}/10.0
                    </div>
                </div>

                <div class="info-section">
                    <div class="section-title">👥 Basic Info</div>
                    <div class="rank-item">
                        <span class="rank-label">Population</span>
                        <span class="rank-value">${data.population}</span>
                    </div>
                    <div class="rank-item">
                        <span class="rank-label">Capital</span>
                        <span class="rank-value">${data.capital}</span>
                    </div>
                </div>
            `;

            if (data.allies.length > 0) {
                html += `
                    <div class="info-section">
                        <div class="section-title">🤝 Allies</div>
                        <div class="relations-list">
                            ${data.allies.map(ally => `<span class="relation-tag ally">${ally}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            if (data.foes.length > 0) {
                html += `
                    <div class="info-section">
                        <div class="section-title">⚔️ Foes</div>
                        <div class="relations-list">
                            ${data.foes.map(foe => `<span class="relation-tag foe">${foe}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('infoPanelContent').innerHTML = html;
            draw();
            hideTooltip();
        }

        // Initialize
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
