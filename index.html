<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAISON — Elevated Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0eb;
    --ivory: #faf8f5;
    --charcoal: #1a1a18;
    --warm-gray: #8a847c;
    --light-gray: #d8d4ce;
    --gold: #b8943f;
    --gold-light: #d4ac5a;
    --shadow: rgba(26,26,24,0.08);
    --shadow-deep: rgba(26,26,24,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--ivory);
    color: var(--charcoal);
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 3rem;
    height: 70px;
    background: rgba(250,248,245,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--light-gray);
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.9rem;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: var(--charcoal);
    text-decoration: none;
  }

  nav { display: flex; gap: 2.2rem; }
  nav a {
    font-size: 0.72rem; letter-spacing: 0.18em; font-weight: 400;
    text-transform: uppercase; color: var(--warm-gray);
    text-decoration: none; transition: color 0.25s;
  }
  nav a:hover, nav a.active { color: var(--charcoal); }

  .header-actions { display: flex; gap: 1.4rem; align-items: center; }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--charcoal); font-size: 1.1rem;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: background 0.2s;
    position: relative;
  }
  .icon-btn:hover { background: var(--cream); }
  .cart-count {
    position: absolute; top: -2px; right: -2px;
    background: var(--gold); color: white;
    font-size: 0.55rem; width: 16px; height: 16px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 500;
  }

  /* ── MAIN LAYOUT ── */
  main {
    margin-top: 70px;
    display: grid;
    grid-template-columns: 300px 1fr 340px;
    height: calc(100vh - 70px);
    overflow: hidden;
  }

  /* ── LEFT PANEL — CATALOG ── */
  .catalog-panel {
    background: var(--cream);
    border-right: 1px solid var(--light-gray);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 1.4rem 1.6rem 1rem;
    border-bottom: 1px solid var(--light-gray);
  }
  .panel-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem; font-weight: 400; letter-spacing: 0.05em;
    margin-bottom: 1rem; color: var(--charcoal);
  }

  /* Category tabs */
  .cat-tabs {
    display: flex; gap: 0.3rem; flex-wrap: wrap;
  }
  .cat-tab {
    padding: 0.3rem 0.8rem;
    border: 1px solid var(--light-gray);
    background: transparent; border-radius: 20px;
    font-size: 0.65rem; letter-spacing: 0.12em;
    text-transform: uppercase; cursor: pointer;
    color: var(--warm-gray); font-family: 'Jost', sans-serif;
    transition: all 0.22s;
  }
  .cat-tab.active, .cat-tab:hover {
    background: var(--charcoal); color: white; border-color: var(--charcoal);
  }

  /* Section tabs */
  .section-tabs {
    display: flex;
    border-bottom: 1px solid var(--light-gray);
  }
  .section-tab {
    flex: 1; padding: 0.85rem;
    background: none; border: none; cursor: pointer;
    font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--warm-gray); font-family: 'Jost', sans-serif;
    border-bottom: 2px solid transparent; transition: all 0.22s;
    margin-bottom: -1px;
  }
  .section-tab.active {
    color: var(--charcoal); border-bottom-color: var(--charcoal);
  }

  /* Clothing grid */
  .clothing-grid {
    flex: 1; overflow-y: auto; padding: 1rem;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0.75rem; align-content: start;
  }
  .clothing-grid::-webkit-scrollbar { width: 4px; }
  .clothing-grid::-webkit-scrollbar-thumb { background: var(--light-gray); border-radius: 2px; }

  .clothing-card {
    background: white; border-radius: 8px;
    overflow: hidden; cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.25s; position: relative;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .clothing-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px var(--shadow-deep); }
  .clothing-card.selected { border-color: var(--gold); }
  .clothing-card.selected::after {
    content: '✓'; position: absolute; top: 6px; right: 6px;
    background: var(--gold); color: white; border-radius: 50%;
    width: 20px; height: 20px; font-size: 0.65rem;
    display: flex; align-items: center; justify-content: center;
  }

  .card-visual {
    height: 100px;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; position: relative; overflow: hidden;
  }

  .card-info { padding: 0.6rem 0.7rem; }
  .card-name {
    font-size: 0.7rem; letter-spacing: 0.05em;
    color: var(--charcoal); font-weight: 500; margin-bottom: 0.15rem;
  }
  .card-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem; color: var(--gold);
  }

  /* ── CENTER — MODEL STAGE ── */
  .model-stage {
    background: linear-gradient(160deg, #f0ece6 0%, #e8e3dc 50%, #ede8e1 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }

  .stage-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 80% at 50% 100%, rgba(184,148,63,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 20% 20%, rgba(255,255,255,0.4) 0%, transparent 60%);
  }

  /* Floor shadow */
  .stage-floor {
    position: absolute; bottom: 60px; left: 50%;
    transform: translateX(-50%);
    width: 160px; height: 20px;
    background: radial-gradient(ellipse, rgba(26,26,24,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* View controls */
  .view-controls {
    position: absolute; top: 1.5rem; left: 50%; transform: translateX(-50%);
    display: flex; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
    border-radius: 30px; padding: 0.3rem;
    border: 1px solid var(--light-gray);
    gap: 0.2rem; z-index: 10;
  }
  .view-btn {
    padding: 0.4rem 1rem; border-radius: 20px; border: none;
    font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; font-family: 'Jost', sans-serif;
    color: var(--warm-gray); background: transparent; transition: all 0.22s;
  }
  .view-btn.active {
    background: var(--charcoal); color: white;
  }

  /* Rotate controls */
  .rotate-controls {
    position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 1rem;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
    border-radius: 30px; padding: 0.5rem 1.4rem;
    border: 1px solid var(--light-gray);
  }
  .rotate-btn {
    background: none; border: none; cursor: pointer;
    color: var(--charcoal); font-size: 1rem; padding: 0.2rem;
    transition: transform 0.15s;
  }
  .rotate-btn:hover { transform: scale(1.2); }
  .rotate-hint {
    font-size: 0.6rem; letter-spacing: 0.12em; color: var(--warm-gray); text-transform: uppercase;
  }

  /* Zoom controls */
  .zoom-controls {
    position: absolute; right: 1.5rem; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 0.4rem;
  }
  .zoom-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
    border: 1px solid var(--light-gray); cursor: pointer;
    font-size: 1rem; display: flex; align-items: center; justify-content: center;
    color: var(--charcoal); transition: all 0.2s;
  }
  .zoom-btn:hover { background: white; box-shadow: 0 2px 10px var(--shadow-deep); }

  /* ─── SVG MODEL ─── */
  .model-wrapper {
    position: relative; z-index: 2;
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }

  .model-svg {
    width: 220px;
    filter: drop-shadow(0 12px 24px rgba(26,26,24,0.12));
    transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  /* ── RIGHT PANEL — DETAILS ── */
  .detail-panel {
    border-left: 1px solid var(--light-gray);
    background: white;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .outfit-summary {
    padding: 1.6rem;
    border-bottom: 1px solid var(--light-gray);
  }
  .outfit-label {
    font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--warm-gray); margin-bottom: 0.6rem;
  }
  .outfit-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem; font-weight: 400; line-height: 1.2;
    color: var(--charcoal);
  }

  /* Outfit pieces */
  .outfit-pieces {
    padding: 1.2rem 1.6rem;
    border-bottom: 1px solid var(--light-gray);
    display: flex; flex-direction: column; gap: 0.8rem;
  }
  .piece-row {
    display: flex; align-items: center; gap: 0.9rem;
    padding: 0.7rem; border-radius: 8px;
    background: var(--ivory); position: relative;
  }
  .piece-row.empty { opacity: 0.4; border: 1px dashed var(--light-gray); }
  .piece-emoji { font-size: 1.8rem; width: 40px; text-align: center; }
  .piece-info { flex: 1; }
  .piece-type {
    font-size: 0.58rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--warm-gray); margin-bottom: 0.15rem;
  }
  .piece-name { font-size: 0.82rem; color: var(--charcoal); font-weight: 500; }
  .piece-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem; color: var(--gold);
  }
  .remove-piece {
    position: absolute; top: 6px; right: 8px;
    background: none; border: none; cursor: pointer;
    color: var(--light-gray); font-size: 0.9rem; transition: color 0.2s;
  }
  .remove-piece:hover { color: #c0392b; }

  /* Color & size */
  .options-section {
    padding: 1.2rem 1.6rem;
    border-bottom: 1px solid var(--light-gray);
  }
  .option-label {
    font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--warm-gray); margin-bottom: 0.7rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .option-label span { color: var(--charcoal); font-size: 0.7rem; }

  .color-swatches { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .color-swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: all 0.2s;
    position: relative;
  }
  .color-swatch.active { border-color: var(--charcoal); transform: scale(1.15); }
  .color-swatch::after {
    content: ''; position: absolute; inset: -3px;
    border-radius: 50%; border: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .color-swatch.active::after { border-color: var(--charcoal); }

  .size-options { display: flex; gap: 0.4rem; }
  .size-btn {
    width: 36px; height: 36px; border: 1px solid var(--light-gray);
    background: none; border-radius: 6px; cursor: pointer;
    font-size: 0.72rem; font-family: 'Jost', sans-serif;
    color: var(--charcoal); transition: all 0.2s;
  }
  .size-btn:hover { border-color: var(--charcoal); }
  .size-btn.active { background: var(--charcoal); color: white; border-color: var(--charcoal); }

  /* Total & actions */
  .purchase-section {
    padding: 1.4rem 1.6rem; margin-top: auto;
  }
  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 1.2rem;
  }
  .total-label {
    font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--warm-gray);
  }
  .total-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 400; color: var(--charcoal);
  }

  .btn-primary {
    width: 100%; padding: 1rem;
    background: var(--charcoal); color: white;
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
    font-family: 'Jost', sans-serif; font-weight: 400;
    transition: all 0.25s; margin-bottom: 0.7rem;
  }
  .btn-primary:hover { background: #2d2d2b; transform: translateY(-1px); box-shadow: 0 4px 14px var(--shadow-deep); }

  .btn-secondary {
    width: 100%; padding: 0.85rem;
    background: transparent; color: var(--charcoal);
    border: 1px solid var(--light-gray); border-radius: 6px; cursor: pointer;
    font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
    font-family: 'Jost', sans-serif; transition: all 0.25s;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .btn-secondary:hover { border-color: var(--charcoal); }

  /* Toast */
  .toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--charcoal); color: white;
    padding: 0.8rem 1.8rem; border-radius: 30px;
    font-size: 0.72rem; letter-spacing: 0.1em;
    opacity: 0; transition: all 0.35s; z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Animations */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  .model-change { animation: pulse 0.4s ease; }
  .card-enter { animation: slideIn 0.3s ease forwards; }

  /* Scrollbar for detail panel */
  .detail-panel { overflow-y: auto; }
  .detail-panel::-webkit-scrollbar { width: 3px; }
  .detail-panel::-webkit-scrollbar-thumb { background: var(--light-gray); }

  /* Outfit name badge */
  .outfit-badge {
    display: inline-block; padding: 0.25rem 0.8rem;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: white; border-radius: 20px;
    font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo" href="#">MAISON</a>
  <nav>
    <a href="#" class="active">Studio</a>
    <a href="#">Collections</a>
    <a href="#">Lookbook</a>
    <a href="#">About</a>
  </nav>
  <div class="header-actions">
    <button class="icon-btn" title="Search">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
    <button class="icon-btn" title="Wishlist" id="wishlistBtn">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
    <button class="icon-btn" title="Cart" id="cartBtn">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- MAIN -->
<main>

  <!-- LEFT: Catalog -->
  <div class="catalog-panel">
    <div class="panel-header">
      <div class="panel-title">Wardrobe</div>
      <div class="cat-tabs">
        <button class="cat-tab active" onclick="filterCat(this,'all')">All</button>
        <button class="cat-tab" onclick="filterCat(this,'men')">Men</button>
        <button class="cat-tab" onclick="filterCat(this,'women')">Women</button>
        <button class="cat-tab" onclick="filterCat(this,'casual')">Casual</button>
        <button class="cat-tab" onclick="filterCat(this,'formal')">Formal</button>
      </div>
    </div>
    <div class="section-tabs">
      <button class="section-tab active" onclick="showSection(this,'tops')">Tops</button>
      <button class="section-tab" onclick="showSection(this,'bottoms')">Bottoms</button>
      <button class="section-tab" onclick="showSection(this,'outer')">Outer</button>
    </div>
    <div class="clothing-grid" id="clothingGrid"></div>
  </div>

  <!-- CENTER: Model Stage -->
  <div class="model-stage">
    <div class="stage-bg"></div>

    <div class="view-controls">
      <button class="view-btn active" onclick="setView(this,'front')">Front</button>
      <button class="view-btn" onclick="setView(this,'side')">Side</button>
      <button class="view-btn" onclick="setView(this,'back')">Back</button>
    </div>

    <div class="model-wrapper" id="modelWrapper">
      <svg class="model-svg" id="modelSVG" viewBox="0 0 220 520" xmlns="http://www.w3.org/2000/svg">
        <!-- Model will be drawn via JS -->
      </svg>
    </div>

    <div class="stage-floor"></div>

    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomModel(1.1)">+</button>
      <button class="zoom-btn" onclick="zoomModel(0.9)">−</button>
    </div>

    <div class="rotate-controls">
      <button class="rotate-btn" onclick="rotateModel(-1)">←</button>
      <span class="rotate-hint">Rotate</span>
      <button class="rotate-btn" onclick="rotateModel(1)">→</button>
    </div>
  </div>

  <!-- RIGHT: Details -->
  <div class="detail-panel">
    <div class="outfit-summary">
      <div class="outfit-badge">Virtual Studio</div>
      <div class="outfit-label">Current Look</div>
      <div class="outfit-title" id="outfitTitle">Start Building<br>Your Outfit</div>
    </div>

    <div class="outfit-pieces" id="outfitPieces">
      <div class="piece-row empty" id="slot-top">
        <div class="piece-emoji">👕</div>
        <div class="piece-info">
          <div class="piece-type">Top</div>
          <div class="piece-name">Select a top</div>
        </div>
      </div>
      <div class="piece-row empty" id="slot-bottom">
        <div class="piece-emoji">👖</div>
        <div class="piece-info">
          <div class="piece-type">Bottom</div>
          <div class="piece-name">Select bottoms</div>
        </div>
      </div>
      <div class="piece-row empty" id="slot-outer">
        <div class="piece-emoji">🧥</div>
        <div class="piece-info">
          <div class="piece-type">Outerwear</div>
          <div class="piece-name">Optional layer</div>
        </div>
      </div>
    </div>

    <div class="options-section">
      <div class="option-label">Color <span id="colorName">—</span></div>
      <div class="color-swatches" id="colorSwatches">
        <div class="color-swatch active" style="background:#1a1a18" onclick="selectColor(this,'Noir')" title="Noir"></div>
        <div class="color-swatch" style="background:#8b6f5e" onclick="selectColor(this,'Mocha')" title="Mocha"></div>
        <div class="color-swatch" style="background:#c4a882" onclick="selectColor(this,'Sand')" title="Sand"></div>
        <div class="color-swatch" style="background:#4a6fa5" onclick="selectColor(this,'Navy')" title="Navy"></div>
        <div class="color-swatch" style="background:#7a9e7e" onclick="selectColor(this,'Sage')" title="Sage"></div>
        <div class="color-swatch" style="background:#c0392b" onclick="selectColor(this,'Bordeaux')" title="Bordeaux"></div>
        <div class="color-swatch" style="background:#f5f0eb;border:1px solid #d8d4ce" onclick="selectColor(this,'Ivory')" title="Ivory"></div>
        <div class="color-swatch" style="background:#2c2c54" onclick="selectColor(this,'Plum')" title="Plum"></div>
      </div>
    </div>

    <div class="options-section">
      <div class="option-label">Size <span id="sizeName">M</span></div>
      <div class="size-options">
        <button class="size-btn" onclick="selectSize(this,'XS')">XS</button>
        <button class="size-btn" onclick="selectSize(this,'S')">S</button>
        <button class="size-btn active" onclick="selectSize(this,'M')">M</button>
        <button class="size-btn" onclick="selectSize(this,'L')">L</button>
        <button class="size-btn" onclick="selectSize(this,'XL')">XL</button>
      </div>
    </div>

    <div class="purchase-section">
      <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total-price" id="totalPrice">$0</span>
      </div>
      <button class="btn-primary" onclick="addToCart()">Add Outfit to Cart</button>
      <button class="btn-secondary" onclick="addToWishlist()">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Save to Wishlist
      </button>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──
const catalog = {
  tops: [

// ── STATE ──
let state = {
  section: 'tops',
  category: 'all',
  selected: { top: null, bottom: null, outer: null },
  zoom: 1,
  rotation: 0,
  view: 'front',
  color: 'Noir',
  size: 'M',
  cartCount: 0
};

// ── RENDER GRID ──
function renderGrid() {
  const grid = document.getElementById('clothingGrid');
  grid.innerHTML = '';
  const items = catalog[state.section] || [];
  const filtered = state.category === 'all'
    ? items
    : items.filter(i => i.cats.includes(state.category));

  filtered.forEach((item, idx) => {
    const slotKey = state.section === 'tops' ? 'top' : state.section === 'bottoms' ? 'bottom' : 'outer';
    const isSelected = state.selected[slotKey]?.id === item.id;
    const card = document.createElement('div');
    card.className = `clothing-card card-enter${isSelected ? ' selected' : ''}`;
    card.style.animationDelay = `${idx * 0.05}s`;
    card.innerHTML = `
      <div class="card-visual" style="background:${item.bg}20">
        <span>${item.emoji}</span>
      </div>
      <div class="card-info">
        <div class="card-name">${item.name}</div>
        <div class="card-price">$${item.price}</div>
      </div>`;
    card.onclick = () => selectItem(item, slotKey);
    grid.appendChild(card);
  });
}

function selectItem(item, slot) {
  if (state.selected[slot]?.id === item.id) {
    state.selected[slot] = null;
  } else {
    state.selected[slot] = item;
  }
  renderGrid();
  updateDetailPanel();
  renderModel();
}

// ── DETAIL PANEL ──
function updateDetailPanel() {
  const { top, bottom, outer } = state.selected;
  const pieces = [
    { slot:'top', emoji:'👕', type:'Top', item: top },
    { slot:'bottom', emoji:'👖', type:'Bottom', item: bottom },
    { slot:'outer', emoji:'🧥', type:'Outerwear', item: outer },
  ];

  pieces.forEach(p => {
    const el = document.getElementById(`slot-${p.slot}`);
    if (p.item) {
      el.className = 'piece-row';
      el.innerHTML = `
        <div class="piece-emoji">${p.item.emoji}</div>
        <div class="piece-info">
          <div class="piece-type">${p.type}</div>
          <div class="piece-name">${p.item.name}</div>
        </div>
        <div class="piece-price">$${p.item.price}</div>
        <button class="remove-piece" onclick="removeSlot('${p.slot}')">✕</button>`;
    } else {
      el.className = 'piece-row empty';
      el.innerHTML = `
        <div class="piece-emoji">${p.emoji}</div>
        <div class="piece-info">
          <div class="piece-type">${p.type}</div>
          <div class="piece-name">Select ${p.type.toLowerCase()}</div>
        </div>`;
    }
  });

  const total = (top?.price||0) + (bottom?.price||0) + (outer?.price||0);
  document.getElementById('totalPrice').textContent = `$${total}`;

  const names = [top?.name, outer?.name].filter(Boolean);
  if (names.length) {
    document.getElementById('outfitTitle').innerHTML = names.join(' &<br>') + (bottom ? `<br>${bottom.name}` : '');
  } else if (bottom) {
    document.getElementById('outfitTitle').textContent = bottom.name;
  } else {
    document.getElementById('outfitTitle').innerHTML = 'Start Building<br>Your Outfit';
  }
}

function removeSlot(slot) {
  state.selected[slot] = null;
  updateDetailPanel();
  renderModel();
  renderGrid();
}

// ── CONTROLS ──
function showSection(btn, section) {
  document.querySelectorAll('.section-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.section = section;
  renderGrid();
}

function filterCat(btn, cat) {
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.category = cat;
  renderGrid();
}

function setView(btn, view) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.view = view;
  renderModel();
}

let currentScale = 1;
function zoomModel(factor) {
  currentScale = Math.max(0.6, Math.min(1.6, currentScale * factor));
  document.getElementById('modelWrapper').style.transform = `scale(${currentScale})`;
}

let currentRotation = 0;
function rotateModel(dir) {
  currentRotation += dir * 15;
  document.getElementById('modelWrapper').style.transform =
    `scale(${currentScale}) rotateY(${currentRotation}deg)`;
}

function selectColor(swatch, name) {
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  swatch.classList.add('active');
  state.color = name;
  document.getElementById('colorName').textContent = name;
}

function selectSize(btn, size) {
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.size = size;
  document.getElementById('sizeName').textContent = size;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function addToCart() {
  const { top, bottom, outer } = state.selected;
  if (!top && !bottom && !outer) {
    showToast('Select at least one item first.');
    return;
  }
  state.cartCount++;
  document.getElementById('cartCount').textContent = state.cartCount;
  showToast('✓ Outfit added to cart');
}

function addToWishlist() {
  const { top, bottom, outer } = state.selected;
  if (!top && !bottom && !outer) {
    showToast('Select at least one item first.');
    return;
  }
  showToast('♥ Saved to wishlist');
}
