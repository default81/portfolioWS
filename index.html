<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Explorer - Interactive World Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0a1428;
            --secondary: #1b2d4d;
            --accent: #00d4ff;
            --accent-dark: #0099cc;
            --text-light: #e0e0e0;
            --text-dark: #1a1a1a;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
        }

        body.light-mode {
            --primary: #ffffff;
            --secondary: #f0f0f0;
            --accent: #0066cc;
            --text-light: #333333;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: background 0.3s ease;
        }

        header {
            background: rgba(10, 20, 40, 0.95);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
            position: relative;
            z-index: 50;
        }

        body.light-mode header { background: rgba(255, 255, 255, 0.95); }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            white-space: nowrap;
        }

        body.light-mode .logo { text-shadow: none; }

        .tagline { font-size: 0.85rem; color: var(--text-light); opacity: 0.7; }

        .search-container {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: rgba(0, 212, 255, 0.1);
            color: var(--text-light);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        body.light-mode .search-bar {
            background: rgba(0, 102, 204, 0.05);
            color: #333;
            border-color: #0066cc;
        }

        .search-bar:focus {
            outline: none;
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .search-bar::placeholder { color: rgba(255, 255, 255, 0.5); }
        body.light-mode .search-bar::placeholder { color: rgba(0, 0, 0, 0.3); }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(27, 45, 77, 0.95);
            border: 2px solid var(--accent);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 1001;
            margin-top: -2px;
        }

        body.light-mode .search-results {
            background: rgba(240, 240, 240, 0.95);
            border-color: #0066cc;
        }

        .search-results.active { display: block; }

        .search-result-item {
            padding: 0.8rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .search-result-item:hover {
            background: rgba(0, 212, 255, 0.2);
            padding-left: 1.5rem;
        }

        body.light-mode .search-result-item:hover { background: rgba(0, 102, 204, 0.1); }

        .header-controls { display: flex; gap: 1rem; align-items: center; }

        .theme-toggle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: var(--text-dark);
            transform: rotate(20deg);
        }

        .header-info { text-align: right; font-size: 0.95rem; color: var(--text-light); white-space: nowrap; }

        .container {
            display: flex;
            height: calc(100vh - 80px);
            gap: 1rem;
            padding: 1rem;
        }

        .map-container {
            flex: 1;
            background: rgba(27, 45, 77, 0.5);
            border: 2px solid var(--accent);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        body.light-mode .map-container {
            background: rgba(240, 240, 240, 0.8);
            border-color: #0066cc;
        }

        .map-container:active { cursor: grabbing; }

        svg { display: block; width: 100%; height: 100%; }

        .tooltip {
            position: fixed;
            background: rgba(10, 20, 40, 0.95);
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 1rem;
            pointer-events: none;
            z-index: 1000;
            max-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
            display: none;
        }

        body.light-mode .tooltip {
            background: rgba(255, 255, 255, 0.95);
            border-color: #0066cc;
        }

        .tooltip.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .tooltip-country {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tooltip-info { font-size: 0.85rem; color: var(--text-light); line-height: 1.5; margin-bottom: 0.5rem; }

        .tooltip-fact {
            font-size: 0.8rem;
            color: var(--success);
            font-style: italic;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
        }

        .tooltip-hint { font-size: 0.75rem; color: var(--warning); margin-top: 0.5rem; font-style: italic; }

        .info-panel {
            width: 380px;
            background: rgba(27, 45, 77, 0.8);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        body.light-mode .info-panel {
            background: rgba(255, 255, 255, 0.9);
            border-color: #0066cc;
        }

        .info-panel::-webkit-scrollbar { width: 8px; }
        .info-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .info-panel::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        .info-panel::-webkit-scrollbar-thumb:hover { background: var(--accent-dark); }

        .panel-header {
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        body.light-mode .panel-title { color: #0066cc; text-shadow: none; }

        .panel-subtitle { font-size: 0.85rem; color: var(--text-light); opacity: 0.7; margin-top: 0.3rem; }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-light);
            opacity: 0.5;
        }

        .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }

        .info-section { margin-bottom: 1.5rem; }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--accent);
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background: rgba(0, 212, 255, 0.05);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
        }

        body.light-mode .rank-item {
            background: rgba(0, 102, 204, 0.05);
            border-left-color: #0066cc;
        }

        .rank-label { font-weight: 600; color: var(--text-light); }
        .rank-value { color: var(--success); font-weight: 700; font-size: 1.1rem; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.6); }
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            z-index: 40;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .control-btn:hover {
            background: var(--accent);
            color: var(--text-dark);
            transform: scale(1.1);
        }

        .control-btn:active { transform: scale(0.95); }

        @media (max-width: 1200px) {
            .container { flex-direction: column; }
            .info-panel { width: 100%; height: 250px; }
            .header-content { flex-direction: column; gap: 1rem; }
            .search-container { max-width: 100%; }
        }

        @media (max-width: 600px) {
            .logo { font-size: 1.3rem; }
            .tagline, .header-info { display: none; }
            .control-btn { width: 40px; height: 40px; font-size: 1rem; }
            .controls { bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>
    <header>

        function init() {

            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            const searchBar = document.getElementById('searchBar');
            searchBar.addEventListener('input', handleSearch);
            searchBar.addEventListener('focus', () => {
                if (searchBar.value) document.getElementById('searchResults').classList.add('active');
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container')) {
                    document.getElementById('searchResults').classList.remove('active');
                }
            });

            document.getElementById('resetBtn').addEventListener('click', resetView);
            document.getElementById('zoomInBtn').addEventListener('click', zoomIn);
            document.getElementById('zoomOutBtn').addEventListener('click', zoomOut);
        }

        function toggleTheme() {
            appState.isDarkMode = !appState.isDarkMode;
            document.body.classList.toggle('light-mode');
            document.getElementById('themeToggle').textContent = appState.isDarkMode ? '🌙' : '☀️';
            localStorage.setItem('theme', appState.isDarkMode ? 'dark' : 'light');
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');

            if (!query) {
                resultsContainer.classList.remove('active');
                resultsContainer.innerHTML = '';
                return;
            }

            const filtered = appState.allCountries.filter(c => c.toLowerCase().includes(query));

            if (filtered.length === 0) {
                resultsContainer.innerHTML = '<div class="search-result-item">No countries found</div>';
            } else {
                resultsContainer.innerHTML = filtered.map(country =>
                    `<div class="search-result-item" data-country="${country}">
                        ${appState.countryData[country].flag} ${country}
                    </div>`
                ).join('');

                resultsContainer.querySelectorAll('.search-result-item').forEach(item => {
                    if (item.dataset.country) {
                        item.addEventListener('click', () => {
                            selectCountry(item.dataset.country);
                            document.getElementById('searchBar').value = '';
                            resultsContainer.classList.remove('active');
                        });
                    }
                });
            }

            resultsContainer.classList.add('active');
        }

        // ==================== WORLD MAP ====================
        function loadWorldMap() {
            const container = document.querySelector('.map-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            const svg = d3.select('#mapSVG')
                .attr('width', width)
                .attr('height', height);

            // Background
            svg.append('rect')
                .attr('width', width)
                .attr('height', height)
                .attr('fill', appState.isDarkMode ? 'rgba(10, 20, 40, 0.3)' : 'rgba(240, 240, 240, 0.3)');

            // Group for pan/zoom
            const g = svg.append('g').attr('class', 'map-group');

            const projection = d3.geoMercator()
                .scale(width / 6.5)
                .translate([width / 2, height / 1.5]);

            const pathGenerator = d3.geoPath().projection(projection);

            // ✅ FIX: Use topojson (the loaded library) instead of the custom broken function
            d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(topology => {
                const countries = topojson.feature(topology, topology.objects.countries).features;

                g.selectAll('.country')
                    .data(countries)
                    .enter()
                    .append('path')
                    .attr('class', 'country')
                    .attr('d', pathGenerator)
                    .attr('fill', '#00aa66')
                    .attr('stroke', appState.isDarkMode ? '#0a1428' : '#ffffff')
                    .attr('stroke-width', 0.5)
                    .style('cursor', 'pointer')
                    .style('opacity', 0.8)
                    .on('mouseover', function(event, d) {
                        const name = countryIdMap[+d.id];
                        if (name && appState.countryData[name]) {
                            d3.select(this).attr('fill', '#ffaa00').style('opacity', 1);
                            showTooltip(event, name);
                            document.getElementById('currentCountry').textContent = `👉 ${name.toUpperCase()}`;
                        }
                    })
                    .on('mousemove', function(event, d) {
                        const name = countryIdMap[+d.id];
                        if (name && appState.countryData[name]) {
                            moveTooltip(event);
                        }
                    })
                    .on('mouseout', function(event, d) {
                        const name = countryIdMap[+d.id];
                        const isSelected = appState.selectedCountry === name;
                        d3.select(this)
                            .attr('fill', isSelected ? '#ffaa00' : '#00aa66')
                            .style('opacity', isSelected ? 1 : 0.8);
                        hideTooltip();
                        if (!appState.selectedCountry) {
                            document.getElementById('currentCountry').textContent = '👆 Hover over a country';
                        }
                    })
                    .on('click', function(event, d) {
                        const name = countryIdMap[+d.id];
                        if (name && appState.countryData[name]) {
                            selectCountry(name);
                        }
                    });

            }).catch(err => {
                console.error('Error loading map:', err);
                svg.append('text')
                    .attr('x', width / 2)
                    .attr('y', height / 2)
                    .attr('text-anchor', 'middle')
                    .attr('fill', 'red')
                    .attr('font-size', '16px')
                    .text('Error loading map data. Please check your internet connection.');
            });

            // ✅ FIX: Use D3 zoom behavior (not CSS transform) for proper pan/zoom
            const zoom = d3.zoom()
                .scaleExtent([1, 8])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });

            svg.call(zoom);
            appState.zoomBehavior = zoom;
            appState.svg = svg;
        }

        function showTooltip(event, country) {
            const data = appState.countryData[country];
            if (!data) return;
            const tooltip = document.getElementById('tooltip');
            document.getElementById('tooltipCountry').textContent = `${data.flag} ${country}`;
            document.getElementById('tooltipInfo').textContent = `Capital: ${data.capital} • Population: ${data.population}`;
            document.getElementById('tooltipFact').textContent = `💡 ${data.fact}`;
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 20) + 'px';
            tooltip.classList.add('active');
        }

        function moveTooltip(event) {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 20) + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('active');
        }

        function selectCountry(country) {
            // Reset previous highlight
            d3.selectAll('.country')
                .attr('fill', d => countryIdMap[+d.id] === country ? '#ffaa00' : '#00aa66')
                .style('opacity', d => countryIdMap[+d.id] === country ? 1 : 0.8);

            appState.selectedCountry = country;
            const data = appState.countryData[country];
            document.getElementById('currentCountry').textContent = `${data.flag} ${country.toUpperCase()}`;

            document.getElementById('infoPanelContent').innerHTML = `
                <div class="panel-header">
                    <div class="panel-title">${data.flag} ${country}</div>
                    <div class="panel-subtitle">${data.region}</div>
                </div>
                <div class="info-section">
                    <div class="section-title">📊 Economic Indicators</div>
                    <div class="rank-item">
                        <span class="rank-label">GDP</span>
                        <span class="rank-value">${data.gdp}</span>
                    </div>
                    <div class="rank-item">
                        <span class="rank-label">GDP Per Capita</span>
                        <span class="rank-value">${data.gdpPerCapita}</span>
                    </div>
                </div>
                <div class="info-section">
                    <div class="section-title">😊 Quality of Life</div>
                    <div class="rank-item">
                        <span class="rank-label">Happiness Index</span>
                        <span class="rank-value">${data.happinessIndex}/10</span>
                    </div>
                </div>
                <div class="info-section">
                    <div class="section-title">👥 Basic Info</div>
                    <div class="rank-item">
                        <span class="rank-label">Population</span>
                        <span class="rank-value">${data.population}</span>
                    </div>
                    <div class="rank-item">
                        <span class="rank-label">Capital</span>
                        <span class="rank-value">${data.capital}</span>
                    </div>
                </div>
                <div class="info-section">
                    <div class="section-title">💡 Fun Fact</div>
                    <div style="font-size: 0.9rem; color: var(--success); padding: 0.8rem; background: rgba(0, 255, 136, 0.1); border-radius: 4px; border-left: 3px solid var(--success);">
                        ${data.fact}
                    </div>
                </div>
            `;
            hideTooltip();
        }

        // ==================== ZOOM CONTROLS ====================
        function zoomIn() {
            if (!appState.svg || !appState.zoomBehavior) return;
            appState.svg.transition().duration(400).call(appState.zoomBehavior.scaleBy, 1.4);
        }

        function zoomOut() {
            if (!appState.svg || !appState.zoomBehavior) return;
            appState.svg.transition().duration(400).call(appState.zoomBehavior.scaleBy, 1 / 1.4);
        }

        function resetView() {
            appState.selectedCountry = null;

            d3.selectAll('.country')
                .attr('fill', '#00aa66')
                .style('opacity', 0.8);

            if (appState.svg && appState.zoomBehavior) {
                appState.svg.transition().duration(500).call(appState.zoomBehavior.transform, d3.zoomIdentity);
            }

            document.getElementById('currentCountry').textContent = '👆 Hover over a country';
            document.getElementById('searchBar').value = '';
            document.getElementById('infoPanelContent').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🌐</div>
                    <p>Click on a country to view detailed information</p>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
