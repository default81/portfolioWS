        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a1428;
            --secondary: #1b2d4d;
            --accent: #00d4ff;
            --accent-dark: #0099cc;
            --text-light: #e0e0e0;
            --text-dark: #1a1a1a;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Header */
        header {
            background: rgba(10, 20, 40, 0.95);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
            position: relative;
            z-index: 50;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-light);
            opacity: 0.7;
        }

        .header-info {
            text-align: right;
        }

        .header-info p {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        /* Main Container */
        .container {
            display: flex;
            height: calc(100vh - 80px);
            gap: 1rem;
            padding: 1rem;
        }

        /* Map Area */
        .map-container {
            flex: 1;
            background: rgba(27, 45, 77, 0.5);
            border: 2px solid var(--accent);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        .map-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: rgba(10, 20, 40, 0.95);
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 1rem;
            pointer-events: none;
            z-index: 1000;
            max-width: 250px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
            display: none;
        }

        .tooltip.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .tooltip-country {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tooltip-info {
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        .tooltip-hint {
            font-size: 0.75rem;
            color: var(--success);
            margin-top: 0.5rem;
            font-style: italic;
        }

        /* Info Panel */
        .info-panel {
            width: 350px;
            background: rgba(27, 45, 77, 0.8);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .info-panel::-webkit-scrollbar {
            width: 8px;
        }

        .info-panel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .info-panel::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        .info-panel::-webkit-scrollbar-thumb:hover {
            background: var(--accent-dark);
        }

        .panel-header {
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .panel-subtitle {
            font-size: 0.85rem;
            color: var(--text-light);
            opacity: 0.7;
            margin-top: 0.3rem;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-light);
            opacity: 0.5;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .info-section {
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--accent);
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background: rgba(0, 212, 255, 0.05);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
        }

        .rank-label {
            font-weight: 600;
            color: var(--text-light);
        }

        .rank-value {
            color: var(--success);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .rank-badge {
            display: inline-block;
            background: var(--accent);
            color: var(--text-dark);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rank-badge.gold {
            background: #ffd700;
        }

        .rank-badge.silver {
            background: #c0c0c0;
        }

        .rank-badge.bronze {
            background: #cd7f32;
        }

        .relations-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .relation-tag {
            display: inline-block;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .relation-tag.ally {
            border-color: var(--success);
            color: var(--success);
            background: rgba(0, 255, 136, 0.1);
        }

        .relation-tag.foe {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(255, 68, 68, 0.1);
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            }
        }

        .glow {
            animation: glow 1.5s ease-in-out infinite;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 0.8rem;
            z-index: 40;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .control-btn:hover {
            background: var(--accent);
            color: var(--text-dark);
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
            }

            .info-panel {
                width: 100%;
                height: 250px;
            }

            .map-container {
                flex: 1;
            }
        }

        /* Neon effect */
        .neon-text {
            text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent), 0 0 30px var(--accent);
        }
    </style>
</head>

            },

            'Poland': {

            'Czech Republic': {
                flag: '🇨🇿',

                gdpPerCapita: { rank: 34, value: '$27,800' },
                happinessIndex: { rank: 42, score: 6.1 },
                allies: ['EU', 'USA'],
                foes: [],
                population: '10.5M',
                capital: 'Prague',
                region: 'Europe'
            }
        };

        // ==================== D3.js MAP SETUP ====================
        const width = document.querySelector('.map-container').clientWidth;
        const height = document.querySelector('.map-container').clientHeight;

        const svg = d3.select('#mapSVG')
            .attr('width', width)
            .attr('height', height);

        // Add gradients
        const defs = svg.append('defs');
        defs.append('linearGradient')
            .attr('id', 'countryGradient')
            .attr('x1', '0%').attr('y1', '0%')
            .attr('x2', '100%').attr('y2', '100%')
            .selectAll('stop')
            .data([
                { offset: '0%', color: '#ff9933' },
                { offset: '100%', color: '#ff6600' }
            ])
            .enter().append('stop')
            .attr('offset', d => d.offset)
            .attr('stop-color', d => d.color);

        defs.append('linearGradient')
            .attr('id', 'hoverGradient')
            .attr('x1', '0%').attr('y1', '0%')
            .attr('x2', '100%').attr('y2', '100%')
            .selectAll('stop')
            .data([
                { offset: '0%', color: '#ffcc00' },
                { offset: '100%', color: '#ffaa00' }
            ])
            .enter().append('stop')
            .attr('offset', d => d.offset)
            .attr('stop-color', d => d.color);

        const projection = d3.geoMercator()
            .fitSize([width, height], { type: 'Sphere' });

        const pathGenerator = d3.geoPath().projection(projection);

        let selectedCountry = null;

        // Load world map data
        d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(topology => {
            const countries = feature(topology, topology.objects.countries).features;

            svg.selectAll('.country')
                .data(countries)
                .enter()
                .append('path')
                .attr('class', 'country')
                .attr('d', pathGenerator)
                .attr('fill', 'url(#countryGradient)')
                .attr('stroke', '#0a1428')
                .attr('stroke-width', 0.5)
                .style('cursor', 'pointer')
                .on('mouseover', function(event, d) {
                    const name = getCountryName(d.id);
                    if (name && countryData[name]) {
                        d3.select(this).attr('fill', 'url(#hoverGradient)');
                        showTooltip(event, name);
                    }
                })
                .on('mouseout', function() {
                    d3.select(this).attr('fill', d => selectedCountry === getCountryName(d.id) ? 'url(#hoverGradient)' : 'url(#countryGradient)');
                    hideTooltip();
                })
                .on('click', function(event, d) {
                    const name = getCountryName(d.id);
                    if (name && countryData[name]) {
                        selectCountry(name);
                    }
                });
        }).catch(err => {
            console.error('Error loading world map data:', err);
            svg.append('text')
                .attr('x', width / 2)
                .attr('y', height / 2)
                .attr('text-anchor', 'middle')
                .attr('fill', '#00d4ff')
                .text('Map data loading failed. Please check your internet connection.');
        });

        // ==================== COUNTRY NAME MAPPING ====================
        const countryIdMap = {
            840: 'United States',
            156: 'China',
            392: 'Japan',
            276: 'Germany',
            826: 'United Kingdom',
            250: 'France',
            356: 'India',
            643: 'Russia',
            76: 'Brazil',
            124: 'Canada',
            410: 'South Korea',
            36: 'Australia',
            484: 'Mexico',
            380: 'Italy',
            724: 'Spain',
            818: 'Egypt',
            682: 'Saudi Arabia',
            566: 'Nigeria',
            710: 'South Africa',
            32: 'Argentina',
            792: 'Turkey',
            364: 'Iran',
            360: 'Indonesia',
            586: 'Pakistan',
            764: 'Thailand',
            704: 'Vietnam',
            608: 'Philippines',
            458: 'Malaysia',
            300: 'Greece',
            620: 'Portugal',
            528: 'Netherlands',
            56: 'Belgium',
            40: 'Austria',
            756: 'Switzerland',
            752: 'Sweden',
            578: 'Norway',
            208: 'Denmark',
            246: 'Finland',
            616: 'Poland',
            203: 'Czech Republic'
        };

        function getCountryName(id) {
            return countryIdMap[id] || null;
        }

        // ==================== TOOLTIP ====================
        function showTooltip(event, country) {
            const tooltip = document.getElementById('tooltip');
            const data = countryData[country];

            if (data) {
                document.getElementById('tooltipCountry').textContent = `${data.flag} ${country}`;
                document.getElementById('tooltipInfo').textContent = `${data.capital} • Population: ${data.population}`;

                tooltip.style.left = (event.pageX + 15) + 'px';
                tooltip.style.top = (event.pageY - 20) + 'px';
                tooltip.classList.add('active');
            }
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('active');
        }

        // ==================== COUNTRY SELECTION ====================
        function selectCountry(country) {
            selectedCountry = country;
            const data = countryData[country];

            document.getElementById('currentCountry').textContent = `${data.flag} ${country.toUpperCase()}`;

            let html = `
                <div class="panel-header">
                    <div class="panel-title">${data.flag} ${country}</div>
                    <div class="panel-subtitle">${data.region}</div>
                </div>

                <div class="info-section">
                    <div class="section-title">📊 Economic Indicators</div>
                    <div class="rank-item">
                        <span class="rank-label">GDP Rank</span>
                        <span class="rank-value">#${data.gdp.rank} ${data.gdp.value}</span>
                    </div>
                    <div class="rank-item">
                        <span class="rank-label">GDP Per Capita</span>
                        <span class="rank-value">#${data.gdpPerCapita.rank}</span>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--text-light); padding: 0.5rem 0.8rem; text-align: center; background: rgba(0, 212, 255, 0.05); border-radius: 4px;">
                        ${data.gdpPerCapita.value}
                    </div>
                </div>

                <div class="info-section">
                    <div class="section-title">😊 Quality of Life</div>
                    <div class="rank-item">
                        <span class="rank-label">Happiness Index</span>
                        <span class="rank-value">#${data.happinessIndex.rank}</span>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--success); padding: 0.5rem 0.8rem; text-align: center; background: rgba(0, 255, 136, 0.1); border-radius: 4px; font-weight: 700;">
                        ${data.happinessIndex.score}/10.0
                    </div>
                </div>

                <div class="info-section">
                    <div class="section-title">👥 Basic Info</div>
                    <div class="rank-item">
                        <span class="rank-label">Population</span>
                        <span class="rank-value">${data.population}</span>
                    </div>
                    <div class="rank-item">
                        <span class="rank-label">Capital</span>
                        <span class="rank-value">${data.capital}</span>
                    </div>
                </div>
            `;

            if (data.allies.length > 0) {
                html += `
                    <div class="info-section">
                        <div class="section-title">🤝 Allies</div>
                        <div class="relations-list">
                            ${data.allies.map(ally => `<span class="relation-tag ally">${ally}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            if (data.foes.length > 0) {
                html += `
                    <div class="info-section">
                        <div class="section-title">⚔️ Foes</div>
                        <div class="relations-list">
                            ${data.foes.map(foe => `<span class="relation-tag foe">${foe}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('infoPanelContent').innerHTML = html;
            hideTooltip();
        }

        // ==================== CONTROLS ====================
        document.getElementById('resetBtn').addEventListener('click', () => {
            selectedCountry = null;
            document.getElementById('currentCountry').textContent = 'Hover over a country';
            document.getElementById('infoPanelContent').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🌐</div>
                    <p>Click on a country to view detailed information</p>
                </div>
            `;
        });

        document.getElementById('zoomInBtn').addEventListener('click', () => {
            svg.transition()
                .duration(750)
                .style('transform', 'scale(1.25)');
        });

        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            svg.transition()
                .duration(750)
                .style('transform', 'scale(0.8)');
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            location.reload();
        });

        // Helper function from TopoJSON
        function feature(topology, o) {
            return o.type === 'GeometryCollection' ? { type: 'FeatureCollection', features: o.geometries.map((g, i) => ({ type: 'Feature', properties: o.properties?.[i], geometry: g })) } : { type: 'FeatureCollection', features: [{ type: 'Feature', properties: o.properties, geometry: o }] };
        }
    </script>
</body>
</html>
